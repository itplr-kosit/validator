openapi: 3.1.0
info:
  title: validator-server API
  version: 2.0.0-SNAPSHOT

paths:
  /api/validate:
    description: "Main Validation endpoint"

    post:
      summary: Validate XML-Input
      operationId: validate
      tags:
        - Validation
      requestBody:
        content:
          application/xml:
            schema:
              $ref: "#/components/schemas/InputDocument"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ResultDocument"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/validate/minimal:
    description: "Validation endpoint with minimized result format"

    post:
      summary: Validate XML-Input (minimal result)
      operationId: validateMinimal
      tags:
        - Validation
      requestBody:
        content:
          application/xml:
            schema:
              $ref: "#/components/schemas/InputDocument"
        required: true
      responses:
        "200":
          description: OK (minimized validation result)
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/MinimalResultDocument"
            application/json:
              schema:
                $ref: "#/components/schemas/MinimalResultDocumentJson"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  responses:
    BadRequest:
      description: Request enthält Fehler
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      description: Error Information
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      required: [ code, message ]

    InputDocument:
      type: string
      format: binary
      description: Arbitrary XML-Document

    ResultDocument:
      type: string
      format: binary
      description: Plain KoSIT Validator response in xml based XVRL-Format

    MinimalResultDocument:
      type: string
      format: binary
      description: >
        Minimized KoSIT Validator response in xml based XVRL-Format.
        Contains only a reduced subset of result information.

    MinimalResultDocumentJson:
      type: object
      description: >
        Minimized KoSIT Validator response as JSON. Contains e.g. overall
        validity and condensed list of issues, but omits detailed metadata.
      additionalProperties: true