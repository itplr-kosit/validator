validator:
  framework-version: 1.0.2
  logging:
    json: false
  # Development and test default: the shared test data of this build. Replace for a real deployment.
  scenarios:
    - scenarioPath: ../test-data/src/main/resources/examples/simple/scenarios.xml
      repositoryPath: ../test-data/src/main/resources/examples/simple/repository

quarkus:
  smallrye-openapi:
    store-schema-directory: target/openapi
  swagger-ui:
    path: /docs
    always-include: true
  log:
    console:
      json:
        enabled: ${validator.logging.json}
    level: INFO
  package:
    jar:
      type: uber-jar
  container-image:
    tag: ${quarkus.application.version}
    build: false
    push: false
