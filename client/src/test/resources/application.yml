validator:
  framework-version: 1.0.2
  scenarios:
    - scenarioPath: ../test-data/src/main/resources/examples/simple/scenarios.xml
      repositoryPath: ../test-data/src/main/resources/examples/simple/repository

quarkus:
  # the client under test talks to the server booted by the same @QuarkusTest
  rest-client:
    validator:
      url: http://localhost:${quarkus.http.test-port}
  index-dependency:
    validator-server:
      group-id: org.kosit
      artifact-id: validator-server
